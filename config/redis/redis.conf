bind 0.0.0.0
protected-mode yes

port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

appendonly yes
appendfsync everysec

save 900 1
save 300 10
save 60 10000

dir /data

maxmemory 4gb
maxmemory-policy noeviction

loglevel notice

# Dangerous commands renamed for safety
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
